name: Mimo-Spark-iOS-Build-IPA
on:
  push:
    branches: [ "main", "master", "spark-v3-integration", "spark-v3.1-gps-sol-dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup_Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          
      - name: Recreate_iOS_Folder
        run: |
          rm -rf ios
          flutter create --platforms=ios .
          # flutter create may generate an obsolete widget_test.dart
          # importing package:spark/main.dart / MyApp (old Flutter template).
          # Remove it ONLY when not tracked in our actual repository.
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Inject_iOS_Permissions
        run: |
          PLIST="ios/Runner/Info.plist"
          # GPS / Localisation
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Mimo Spark utilise votre position pour la navigation GPS et le suivi de trajet'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Mimo Spark utilise votre position en arriere-plan pour le suivi GPS'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysUsageDescription string 'Navigation requise en arriere-plan pour la vue satellite'" $PLIST
          # Reseau local (OBD2 WiFi)
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Requis pour communiquer avec le dongle OBD2 WiFi'" $PLIST
          # Microphone et Reconnaissance vocale
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Mimo Spark utilise le microphone pour l assistant vocal'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Reconnaissance vocale pour les commandes mains-libres'" $PLIST
          # Bluetooth (OBD2)
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Connexion Bluetooth a l adaptateur OBD2'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Connexion Bluetooth a l adaptateur OBD2'" $PLIST
          # Camera (HUD)
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Mimo Spark utilise la camera pour le scan HUD'" $PLIST
          # Modes background
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string fetch" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:2 string processing" $PLIST

      - name: Get_Deps
        run: |
          flutter config --enable-ios
          flutter pub get

      - name: Validate_Flutter_Tests
        run: flutter test --no-pub

      - name: Validate_Dart_Analysis
        # Analyze only the real application source. The repository also has
        # unrelated legacy .dart files under assets/images and its root.
        # Keep diagnostics visible; errors are fatal, pre-existing warnings
        # and infos are reported without stopping the iOS build.
        run: flutter analyze --no-pub --no-fatal-infos lib test

      - name: Build_iOS_IPA
        run: |
          flutter build ios --release --no-codesign --dart-define=SPARK_BUILD_SHA=${{ github.sha }}
          
          # Create IPA
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r MIMO_SPARK.ipa Payload
          git rev-parse HEAD > build-commit.txt
          flutter --version >> build-commit.txt

      - name: Upload_Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimo-spark-ipa-${{ github.sha }}
          path: |
            build/ios/iphoneos/MIMO_SPARK.ipa
            build/ios/iphoneos/build-commit.txt
