name: Mimo-Spark-Android-Build-APK

# Build APK Android depuis la branche spark-v3.1-android-sync
# Référence iOS : commit 0d3d7a25c3f7fbb65e478fbddd8b20b6f571c377 (Flutter 3.41.0)
on:
  push:
    branches:
      - spark-v3.1-android-sync
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify source commit
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Message: $(git log -1 --format='%s')"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.41.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Create Native Folders on Cloud
        run: |
          flutter create --org com.mimo . --platforms=android --no-overwrite
          # Nettoyer l'éventuel widget_test.dart obsolète généré par flutter create
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Inject Native Shield
        run: |
          mkdir -p android/app/src/main/kotlin/com/mimo/spark
          cp native/android/MainActivity.kt android/app/src/main/kotlin/com/mimo/spark/MainActivity.kt

      - name: Configure Gradle and Kotlin
        run: |
          # Flutter 3.41 peut générer du KTS ou Groovy selon les options.
          # Si build.gradle existe :
          if [ -f "android/build.gradle" ]; then
            sed -i '1i buildscript { ext.kotlin_version = "1.9.22" }' android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "1.9.22" apply false/' android/settings.gradle || true
          fi

      - name: Add Android Network Permissions & Cleartext
        run: |
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Flutter Analyze
        run: flutter analyze --no-pub --no-fatal-infos lib test || true

      - name: Build APK (Android)
        run: flutter build apk --release --dart-define=SPARK_BUILD_SHA=0d3d7a25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mimo-Spark-Android-Build-APK-V3.1
          path: build/app/outputs/flutter-apk/app-release.apk
